[Main]
; 1 = the frame's length comes from the high resolution counter, 0 = the
; game's own clock stays. Oblivion measures a frame with GetTickCount in
; whole milliseconds, so a 60 Hz frame of 16.67 ms reads as 16 or 17 and a
; 144 Hz frame of 6.94 ms as 6 or 7: every animation and every moving thing
; speeds up and slows down by that much, frame by frame. On Windows the tick
; itself can step by 16 ms when nothing raised the timer resolution.
PreciseFrameClock=1

; 1 = the game's copy of skinned vertices into its vertex buffers is replaced
; by a faster one with the same result, 0 = the game's own copy stays. The
; game copies every vertex of every person in view with a separate memcpy
; call, 8 or 12 bytes each; with people in view that was a fifth of the time
; the scene takes to draw.
FastStreamCopy=1

; 1 = xOBSE finds a script's variables by number instead of searching for
; them, 0 = xOBSE's own search stays. Every time an OBSE expression reads a
; variable of another script ("SomeQuest.someVariable"), xOBSE 22.13 searches
; that script's variable list from the start. A mod with one big quest script
; - Maskar's Oblivion Overhaul's has 3532 variables - pays that search tens
; of thousands of times when it builds its content, and the game hangs for a
; moment. With this on, a long list is searched once and then answered by
; number. Only xOBSE 22.13; with another version xOBSE's search stays.
FastVariableLookup=1

[Diagnostics]
; 1 = a line in the log every ten seconds with the frame lengths the game's
; own clock produced (whole milliseconds and how often each) and the lengths
; the frames were given. Shows the problem on your machine; off for play.
FrameClockTrace=0

; 1 = every vertex copy is done twice, the game's way and the fast way, and
; the two are compared byte for byte; a difference is logged as MISMATCH.
; Slows the game down. Only for checking; off for play.
StreamCopyCheck=0

; 1 = every variable lookup is also done xOBSE's way, that answer is used, and
; a different answer from the fast lookup is logged as MISMATCH. Slows the
; game down. Only for checking; off for play.
VariableLookupCheck=0

; 1 = the game's own lookup of a script's variables is timed, and every burst
; of lookups that takes a millisecond or a thousand lookups gets a line in the
; log: how many, how long, how far the game searched. Changes nothing in the
; game; a little slower. Only for finding out whether that search is worth
; making faster; off for play.
EngineVariableTrace=0
